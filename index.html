<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10263a">

<title>えじメモ</title>

<link rel="icon" href="penguin.png">
<link rel="apple-touch-icon" href="penguin.png">

<link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&family=Nunito:wght@700&display=swap" rel="stylesheet">

<style>
/* ===== あなたのCSSそのまま（省略なし） ===== */
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
margin:0;
color:#eef7ff;
font-family:'Kiwi Maru', serif;
min-height:100vh;
padding-bottom:150px;
background:linear-gradient(to bottom,#dff5ff,#9ed5ef,#467aa0,#10263a);
}
header{position:sticky;top:0;z-index:1000;padding:18px;background:rgba(8,20,32,0.94);}
.title{text-align:center;font-size:34px;font-weight:bold;font-family:'Nunito';color:white;}
.sub{text-align:center;font-size:12px;color:rgba(255,255,255,0.6);}
.row{display:flex;gap:10px;margin-top:12px;}
.flex1{flex:1;}
input,textarea,select{
width:100%;border:none;border-radius:18px;padding:15px;
background:rgba(255,255,255,0.10);color:white;
}
button{border:none;border-radius:16px;padding:12px;cursor:pointer;color:white;background:#34546e;}
.container{padding:14px;max-width:900px;margin:auto;}
.card{margin-top:18px;padding:18px;border-radius:24px;background:rgba(14,28,40,0.82);}
.card-title{font-size:22px;font-weight:bold;}
.memo{margin-top:10px;}
.tag{display:inline-block;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,0.1);margin:3px;font-size:12px;}
.bottom-tabs{position:fixed;bottom:0;width:100%;display:flex;background:rgba(0,0,0,0.7);}
.tab{flex:1;text-align:center;padding:10px;color:white;cursor:pointer;}
.tab.active{background:rgba(120,190,220,0.3);}
</style>
</head>

<body>

<header>
<div class="title">えじメモ</div>
<div class="sub">STREET FIGHTER 6</div>

<div class="row">
<select id="characterSelect" class="flex1"></select>
<button onclick="addCharacter()">追加</button>
</div>

<div class="row">
<input id="searchInput" oninput="renderCards()" placeholder="検索">
</div>
</header>

<div class="container" id="cardList"></div>

<button onclick="openModal()">＋</button>

<div class="modal" id="modal" style="display:none;">
<div class="modal-content">

<input id="titleInput" placeholder="タイトル">
<input id="commandInput" placeholder="コマンド">
<textarea id="memoInput"></textarea>

<button onclick="saveMemo()">保存</button>
<button onclick="closeModal()">閉じる</button>

</div>
</div>

<div class="bottom-tabs">
<div class="tab active" onclick="currentTab='コンボ';renderCards()">コンボ</div>
<div class="tab" onclick="currentTab='+フレ';renderCards()">＋フレ</div>
<div class="tab" onclick="currentTab='起き攻め';renderCards()">起き攻め</div>
</div>

<script type="module">
/* =========================
   Firebase
========================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
getFirestore,
collection,
getDocs,
setDoc,
doc,
deleteDoc
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

/* ★ここだけ自分のFirebaseに変える */
const firebaseConfig = {
apiKey: "YOUR_API_KEY",
authDomain: "YOUR_PROJECT.firebaseapp.com",
projectId: "YOUR_PROJECT_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const col = collection(db, "cards");

/* =========================
   データ
========================= */
let cards = [];
let currentTab = "コンボ";

/* =========================
   読み込み
========================= */
async function load(){

const snap = await getDocs(col);

cards = snap.docs.map(d=>d.data());

renderCards();

}

load();

/* =========================
   保存
========================= */
window.saveMemo = async function(){

const card = {
id: Date.now().toString(),
title: titleInput.value,
command: commandInput.value,
memo: memoInput.value,
tab: currentTab
};

cards.push(card);

await setDoc(doc(col, card.id), card);

renderCards();
closeModal();

}

/* =========================
   表示
========================= */
window.renderCards = function(){

cardList.innerHTML = "";

cards
.filter(c=>c.tab===currentTab)
.filter(c=>c.title.includes(searchInput.value))
.forEach(c=>{

cardList.innerHTML += `
<div class="card">
<div class="card-title">${c.title}</div>
<div>${c.command}</div>
<div class="memo">${c.memo}</div>
</div>
`;

});

}

/* =========================
   UI
========================= */
window.openModal = ()=>modal.style.display="block";
window.closeModal = ()=>modal.style.display="none";

/* =========================
   キャラ（簡易）
========================= */
let characters = ["DEEJAY"];

window.addCharacter = ()=>{
const name = prompt("キャラ名");
if(name) characters.push(name);
renderCharacters();
};

window.renderCharacters = ()=>{
characterSelect.innerHTML =
characters.map(c=>`<option>${c}</option>`).join("");
};

renderCharacters();

</script>

</body>
</html>
